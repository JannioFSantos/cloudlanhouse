<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Jogando — Xbox Play</title>
  <meta name="theme-color" content="#000000" />
  <link rel="stylesheet" href="/assets/style.css" />
  <style>
    html, body { height: 100%; overflow: hidden; }
    body::before { display: none; }
  </style>
</head>
<body>
  <div class="player-shell show-ui" id="shell">
    <div class="player-stage" id="stage">
      <video id="video" autoplay playsinline muted></video>

      <div class="player-top" id="topbar">
        <span class="pill"><span class="dot off" id="statusDot"></span><span id="statusText">conectando</span></span>
        <span class="pill"><span class="k">resta</span><span class="timer" id="clock">--:--</span></span>
        <span class="pill" id="hoursPill"><span class="k">pacote</span><span id="hoursText">—</span></span>
        <span class="pill hidden" id="padPill"><span class="dot live"></span><span id="padText">controle</span></span>
        <span class="spacer"></span>
        <button class="btn btn-ghost btn-sm" id="btnSound">ativar som</button>
        <button class="btn btn-ghost btn-sm" id="btnExtend">+ tempo</button>
        <button class="btn btn-ghost btn-sm" id="btnStats">stats</button>
        <button class="btn btn-ghost btn-sm" id="btnFull">tela cheia</button>
        <button class="btn btn-danger btn-sm" id="btnForfeit">desistir</button>
      </div>

      <div class="stats-panel hidden" id="statsPanel">
        <div class="row"><span class="muted">resolução</span><span id="stRes">—</span></div>
        <div class="row"><span class="muted">fps</span><span id="stFps">—</span></div>
        <div class="row"><span class="muted">bitrate</span><span id="stBitrate">—</span></div>
        <div class="row"><span class="muted">rtt</span><span id="stRtt">—</span></div>
        <div class="row"><span class="muted">jitter</span><span id="stJitter">—</span></div>
        <div class="row"><span class="muted">perda</span><span id="stLoss">—</span></div>
        <div class="row"><span class="muted">codec</span><span id="stCodec">—</span></div>
        <div class="row"><span class="muted">socket</span><span id="stSocket">—</span></div>
      </div>

      <div class="overlay-center" id="overlay">
        <div class="inner" id="overlayInner">
          <div class="spinner"></div>
          <h2 style="margin: 0 0 8px; font-size: 20px;">Carregando sessão…</h2>
          <p class="tiny muted mb-0">Validando seu link.</p>
        </div>
      </div>

      <div class="player-hint" id="hint">
        Use um controle USB/Bluetooth ou os comandos na tela pelo celular ou tablet.
      </div>

      <div class="touch-controls" id="touchControls" role="group" aria-label="Controles do jogo na tela" hidden>
        <div class="touch-shoulders touch-shoulders-left">
          <button type="button" class="touch-button touch-small" data-touch-button="4" aria-label="LB">LB</button>
          <button type="button" class="touch-button touch-small" data-touch-button="6" aria-label="LT">LT</button>
        </div>
        <div class="touch-shoulders touch-shoulders-right">
          <button type="button" class="touch-button touch-small" data-touch-button="5" aria-label="RB">RB</button>
          <button type="button" class="touch-button touch-small" data-touch-button="7" aria-label="RT">RT</button>
        </div>

        <div class="touch-stick" data-touch-stick="0" role="group" aria-label="Alavanca esquerda: mover">
          <span class="touch-stick-knob"></span>
          <small>MOVER</small>
        </div>
        <div class="touch-stick touch-stick-right" data-touch-stick="2" role="group" aria-label="Alavanca direita: câmera">
          <span class="touch-stick-knob"></span>
          <small>CÂMERA</small>
        </div>

        <div class="touch-cluster touch-dpad" role="group" aria-label="Direcional">
          <button type="button" class="touch-button touch-up" data-touch-button="12" aria-label="Cima">▲</button>
          <button type="button" class="touch-button touch-left" data-touch-button="14" aria-label="Esquerda">◀</button>
          <button type="button" class="touch-button touch-down" data-touch-button="13" aria-label="Baixo">▼</button>
          <button type="button" class="touch-button touch-right" data-touch-button="15" aria-label="Direita">▶</button>
        </div>
        <div class="touch-cluster touch-face-buttons" role="group" aria-label="Botões de ação">
          <button type="button" class="touch-button touch-y" data-touch-button="3" aria-label="Y">Y</button>
          <button type="button" class="touch-button touch-x" data-touch-button="2" aria-label="X">X</button>
          <button type="button" class="touch-button touch-b" data-touch-button="1" aria-label="B">B</button>
          <button type="button" class="touch-button touch-a" data-touch-button="0" aria-label="A">A</button>
        </div>
        <div class="touch-center-buttons">
          <button type="button" class="touch-button touch-small" data-touch-button="8" aria-label="Visualizar">VIEW</button>
          <button type="button" class="touch-button touch-small" data-touch-button="9" aria-label="Menu">MENU</button>
        </div>
      </div>
    </div>
  </div>

  <div id="modals"></div>

  <script type="module" src="/assets/play.js"></script>
</body>
</html>
